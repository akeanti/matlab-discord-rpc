name: Bug report
description: Something shows wrong, or doesn't show at all
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did Discord show, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: preview
    attributes:
      label: Output of drpc preview
      description: Run `drpc preview` in MATLAB and paste the output. Remove anything you don't want public.
      render: text
    validations:
      required: true
  - type: input
    id: matlab
    attributes:
      label: MATLAB release
      placeholder: R2024a Update 6
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots of your Discord profile help a lot.
