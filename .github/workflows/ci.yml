name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matlab-tests:
    name: MATLAB tests (${{ matrix.release }})
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # the oldest release drpc supports, and the newest one
        release: [R2021a, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.release }}
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('DiscordRPC'); results = runtests('tests'); disp(table(results)); assertSuccess(results);

  bridge-tests:
    name: Bridge tests (mono, C# 5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mono-mcs mono-runtime
      - name: Run tests
        run: bash tests/run.sh

  windows:
    name: Bridge tests with the csc.exe that ships with Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build like drpc.m does, then test against a fake Discord
        shell: pwsh
        run: ./tests/run.ps1
